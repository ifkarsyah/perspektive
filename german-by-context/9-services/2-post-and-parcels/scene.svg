<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0" y="0" width="1600" height="720" fill="#eef0f2" stroke="none"/>
  <rect x="0" y="720" width="1600" height="180" fill="#c9ccce" stroke="none"/>

  <!-- Post box -->
  <g data-word="der Briefkasten">
    <path d="M80 720 V580" fill="none" stroke-width="10"/>
    <path d="M40 580 V420 c0 -40 160 -40 160 0 V580 Z" fill="#f6d53b"/>
    <rect x="70" y="450" width="100" height="16" rx="4" fill="#2f3337"/>
    <rect x="80" y="500" width="80" height="50" rx="4" fill="#ffffff" stroke-width="2"/>
  </g>

  <!-- Parcel lockers -->
  <g data-word="die Packstation">
    <rect x="240" y="200" width="320" height="520" fill="#4f8a8b"/>
    <path d="M240 330 H560 M240 460 H560 M240 590 H560 M400 200 V720" fill="none" stroke-width="3"/>
    <rect x="360" y="380" width="80" height="60" rx="4" fill="#2f3337"/>
    <rect x="368" y="388" width="64" height="34" fill="#9fe0a8" stroke-width="2"/>
    <path d="M380 270 h10 M520 270 h10 M380 530 h10 M520 530 h10 M380 650 h10 M520 650 h10" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>

  <!-- Post office counter -->
  <g data-word="die Postfiliale">
    <rect x="600" y="500" width="520" height="220" fill="#c9d6df"/>
    <rect x="590" y="482" width="540" height="22" fill="#2f3337"/>
    <rect x="620" y="120" width="480" height="70" rx="6" fill="#ffffff"/>
    <rect x="640" y="132" width="66" height="46" rx="4" fill="#ffffff"/>
    <path d="M640 132 l33 24 l33 -24" fill="none"/>
  </g>
  <g data-word="das Porto">
    <rect x="630" y="440" width="120" height="44" rx="4" fill="#c3cbd0"/>
    <rect x="640" y="400" width="100" height="40" rx="4" fill="#2f3337"/>
    <text x="650" y="428" font-family="monospace" font-size="22" fill="#7fe0a8" stroke="none">0,95€</text>
  </g>
  <g data-word="das Paket">
    <rect x="790" y="370" width="170" height="112" fill="#c89a63"/>
    <path d="M790 400 H960" fill="none" stroke-width="2"/>
    <g data-word="die Adresse"><rect x="810" y="414" width="90" height="56" fill="#ffffff" stroke-width="2"/>
      <path d="M818 428 h70 M818 442 h60" fill="none" stroke-width="2"/></g>
    <g data-word="die Sendungsnummer"><path d="M818 452 v12 M823 452 v12 M830 452 v12 M834 452 v12 M842 452 v12 M848 452 v12 M852 452 v12 M860 452 v12 M866 452 v12 M872 452 v12 M878 452 v12 M884 452 v12" fill="none" stroke-width="2"/></g>
  </g>
  <g data-word="das Päckchen"><rect x="980" y="420" width="90" height="62" fill="#d6ab76"/><path d="M980 440 h90" fill="none" stroke-width="2"/></g>
  <g data-word="das Klebeband">
    <circle cx="1090" cy="460" r="22" fill="#d9bd78"/><circle cx="1090" cy="460" r="10" fill="#eef0f2"/>
  </g>

  <!-- Big envelope -->
  <g data-word="der Umschlag">
    <rect x="1160" y="80" width="400" height="260" rx="6" fill="#fdfbf5"/>
    <path d="M1160 80 l200 140 l200 -140" fill="none" stroke="#e6e1d8" stroke-width="3"/>
  </g>
  <g data-word="der Absender"><path d="M1185 110 h110 M1185 128 h90 M1185 146 h100" fill="none" stroke="#9aa3a8" stroke-width="5"/></g>
  <g data-word="der Empfänger"><path d="M1320 240 h200 M1320 265 h170 M1320 290 h190" fill="none" stroke="#33302c" stroke-width="6"/></g>
  <g data-word="die Briefmarke">
    <rect x="1470" y="100" width="70" height="84" fill="#e45b4f" stroke-dasharray="4 3"/>
    <circle cx="1505" cy="142" r="20" fill="#ffffff" stroke-width="2"/>
  </g>
  <g data-word="das Einschreiben">
    <rect x="1180" y="270" width="110" height="46" rx="4" fill="#3d6fb6"/>
    <text x="1222" y="304" font-family="sans-serif" font-size="30" font-weight="bold" fill="#ffffff" stroke="none">R</text>
  </g>

  <!-- Courier with van -->
  <g data-word="der Paketbote">
    <circle cx="1240" cy="470" r="30" fill="#c58c5c"/>
    <path d="M1210 466 c0 -40 60 -40 60 0" fill="#2f2622"/>
    <path d="M1205 505 h70 l10 140 h-90 Z" fill="#7a5a3c"/>
    <path d="M1215 645 v75 M1265 645 v75" fill="none" stroke="#2f3337" stroke-width="18"/>
    <rect x="1170" y="540" width="80" height="60" fill="#c89a63"/>
  </g>
  <rect x="1320" y="460" width="260" height="220" rx="12" fill="#ffffff"/>
  <path d="M1350 490 h80 v60 h-80 Z" fill="#cfe6f2"/>
  <circle cx="1380" cy="690" r="28" fill="#2b2b2b"/><circle cx="1530" cy="690" r="28" fill="#2b2b2b"/>
  <g data-word="der Briefträger">
    <circle cx="420" cy="620" r="30" fill="#e8b98f"/>
    <path d="M388 610 h64 v-14 c-12 -14 -52 -14 -64 0 Z" fill="#2f3f5c"/>
    <path d="M384 655 h72 l10 140 h-92 Z" fill="#3d6fb6"/>
    <path d="M394 795 v85 M446 795 v85" fill="none" stroke="#2f3f5c" stroke-width="18"/>
    <path d="M390 660 l80 80" fill="none" stroke="#7a4f22" stroke-width="6"/>
    <rect x="450" y="720" width="70" height="60" rx="8" fill="#f6d53b"/>
    <rect x="465" y="705" width="40" height="22" fill="#ffffff" stroke-width="2"/>
  </g>

  <!-- Floor -->
  <g data-word="der Karton">
    <path d="M600 880 V780 h180 v100 Z" fill="#c89a63"/>
    <path d="M600 780 l-30 -40 M780 780 l30 -40 M640 780 l20 -40 M740 780 l-20 -40" fill="none" stroke-width="3"/>
  </g>
  <g data-word="die Benachrichtigungskarte">
    <rect x="830" y="780" width="160" height="96" rx="6" fill="#f6d53b"/>
    <path d="M845 800 h120 M845 820 h90 M845 840 h110" fill="none" stroke-width="3"/>
    <rect x="940" y="840" width="36" height="24" fill="#ffffff" stroke-width="2"/>
  </g>
  <g data-word="das Retourenetikett">
    <rect x="1030" y="790" width="170" height="80" rx="6" fill="#ffffff"/>
    <path d="M1150 830 h-80 M1090 812 l-20 18 l20 18" fill="none" stroke="#e45b4f" stroke-width="6"/>
  </g>
  <g data-word="der Brief">
    <rect x="1260" y="790" width="130" height="86" fill="#ffffff" transform="rotate(-8 1325 833)"/>
    <path d="M1275 810 h90 M1275 830 h90 M1275 850 h60" fill="none" stroke="#9aa3a8" stroke-width="4" transform="rotate(-8 1325 833)"/>
  </g>
</svg>
