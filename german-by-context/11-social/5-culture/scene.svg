    <text x="1100" y="345" font-family="sans-serif" font-size="30" font-weight="bold" fill="#e45b4f" stroke="none">So</text>
    <text x="1100" y="390" font-family="sans-serif" font-size="30" font-weight="bold" fill="#5b8c5a" stroke="none">0 €</text>
  </g>
  <path d="M800 450 H1600" fill="none" stroke-width="6"/>

