  <g data-word="die Ermäßigung">
    <rect x="1040" y="800" width="160" height="80" rx="10" fill="#5b8c5a"/>
    <text x="1070" y="852" font-family="sans-serif" font-size="34" font-weight="bold" fill="#ffffff" stroke="none">-50%</text>
