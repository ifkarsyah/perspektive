<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0" y="0" width="1600" height="900" fill="#1f2b47" stroke="none"/>
  <rect x="0" y="720" width="1600" height="180" fill="#4a4f57" stroke="none"/>
  <circle cx="1480" cy="80" r="40" fill="#f6efc4" stroke="none"/>

  <!-- Späti -->
  <g data-word="der Späti">
    <rect x="30" y="300" width="300" height="420" fill="#c66a43"/>
    <rect x="50" y="330" width="260" height="60" fill="#f6d53b"/>
    <text x="180" y="373" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#33302c" stroke="none">24/7</text>
    <rect x="60" y="420" width="240" height="180" fill="#fff4b0"/>
    <path d="M80 450 h200 M80 500 h200 M80 550 h200" fill="none" stroke-width="3"/>
    <rect x="90" y="470" width="20" height="30" fill="#62b56f" stroke-width="2"/><rect x="120" y="470" width="20" height="30" fill="#b67a3e" stroke-width="2"/><rect x="150" y="520" width="24" height="30" fill="#e45b4f" stroke-width="2"/>
    <rect x="130" y="620" width="100" height="100" fill="#7a4f22"/>
  </g>

  <!-- Pub with bar inside -->
  <g data-word="die Kneipe">
    <rect x="360" y="200" width="600" height="520" fill="#7a5a3c"/>
    <rect x="420" y="220" width="480" height="60" rx="6" fill="#2f3337"/>
    <path d="M460 268 v-36 h22 v36 Z" fill="#f2b84b" stroke-width="2"/>
  </g>
  <g data-word="die Bar">
    <rect x="390" y="300" width="540" height="300" fill="#f6dfa3"/>
    <path d="M410 340 H910 M410 390 H910" fill="none" stroke="#9a6b43" stroke-width="5"/>
    <rect x="430" y="300" width="18" height="38" fill="#62b56f" stroke-width="2"/><rect x="460" y="300" width="18" height="38" fill="#b67a3e" stroke-width="2"/><rect x="490" y="300" width="18" height="38" fill="#e45b4f" stroke-width="2"/>
    <rect x="430" y="352" width="18" height="38" fill="#9fd3ea" stroke-width="2"/><rect x="460" y="352" width="18" height="38" fill="#f6d53b" stroke-width="2"/>
    <rect x="390" y="520" width="540" height="80" fill="#9a6b43"/>
  </g>
  <g data-word="der Cocktail"><path d="M600 520 l-30 -40 h60 Z" fill="#f19e7a"/><path d="M600 520 v-0 M600 480 v40" fill="none" stroke-width="3"/><path d="M590 520 h20" fill="none" stroke-width="3"/><circle cx="625" cy="478" r="8" fill="#e45b4f"/></g>
  <g data-word="der Shot"><path d="M680 520 l-4 -30 h28 l-4 30 Z" fill="#f2c94c"/><path d="M720 520 l-4 -30 h28 l-4 30 Z" fill="#f2c94c"/><path d="M760 520 l-4 -30 h28 l-4 30 Z" fill="#f2c94c"/></g>
  <g data-word="die Musik">
    <path d="M840 470 v-50 l30 -8 v50" fill="none" stroke="#ffffff" stroke-width="4"/>
    <ellipse cx="834" cy="472" rx="9" ry="7" fill="#ffffff" stroke="none"/><ellipse cx="864" cy="464" rx="9" ry="7" fill="#ffffff" stroke="none"/>
  </g>
  <g data-word="die Party">
    <circle cx="480" cy="440" r="18" fill="#e8b98f"/><path d="M465 458 h30 v40 h-30 Z" fill="#b58ad8"/><path d="M465 465 l-20 -25 M495 465 l20 -25" fill="none" stroke-width="5"/>
  </g>
  <g data-word="die Toilette"><rect x="880" y="610" width="60" height="40" rx="4" fill="#ffffff"/>
    <text x="886" y="640" font-family="sans-serif" font-size="24" font-weight="bold" fill="#33302c" stroke="none">WC</text></g>
  <rect x="610" y="620" width="120" height="100" fill="#5b4636"/>

  <!-- Table outside with a round -->
  <rect x="480" y="760" width="360" height="20" fill="#9a6b43"/>
  <path d="M500 780 V880 M820 780 V880" fill="none" stroke-width="8"/>
  <g data-word="die Runde">
    <ellipse cx="660" cy="756" rx="150" ry="12" fill="#c3cbd0"/>
    <g data-word="das Bier">
      <path d="M540 752 v-60 h36 v60 Z" fill="#f2b84b"/><path d="M540 702 c0 -16 36 -16 36 0" fill="#ffffff"/>
      <path d="M600 752 v-60 h36 v60 Z" fill="#f2b84b"/><path d="M600 702 c0 -16 36 -16 36 0" fill="#ffffff"/>
      <path d="M660 752 v-60 h36 v60 Z" fill="#f2b84b"/><path d="M660 702 c0 -16 36 -16 36 0" fill="#ffffff"/>
    </g>
    <g data-word="das Getränk"><path d="M720 752 l-6 -55 h44 l-6 55 Z" fill="#9fd3ea"/><path d="M745 697 l10 -30" fill="none" stroke="#e45b4f" stroke-width="4"/></g>
  </g>

  <!-- Smoking area -->
  <g data-word="der Raucherbereich">
    <rect x="990" y="560" width="200" height="160" rx="10" fill="#2f3a5a"/>
    <path d="M1000 720 V600 h180 V720" fill="none" stroke="#9aa3a8" stroke-width="4"/>
    <circle cx="1090" cy="640" r="20" fill="#c58c5c"/><path d="M1075 660 h30 v50 h-30 Z" fill="#3d9a7a"/>
    <path d="M1105 645 h25" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M1135 640 c10 -15 -10 -25 0 -40 c10 -15 -5 -25 5 -35" fill="none" stroke="#c3cbd0" stroke-width="3"/>
  </g>

  <!-- Last train and night bus -->
  <g data-word="die letzte Bahn">
    <rect x="1230" y="300" width="80" height="80" rx="6" fill="#3d6fb6"/>
    <text x="1252" y="358" font-family="sans-serif" font-size="52" font-weight="bold" fill="#ffffff" stroke="none">U</text>
    <path d="M1270 380 V600" fill="none" stroke-width="6"/>
    <rect x="1210" y="420" width="120" height="50" rx="6" fill="#2f3337"/>
    <text x="1222" y="455" font-family="monospace" font-size="28" fill="#f6d53b" stroke="none">00:47</text>
  </g>
  <g data-word="der Nachtbus">
    <rect x="1220" y="610" width="360" height="110" rx="16" fill="#f6d53b"/>
    <path d="M1240 630 h60 v40 h-60 Z M1320 630 h60 v40 h-60 Z M1400 630 h60 v40 h-60 Z" fill="#fff4b0"/>
    <rect x="1490" y="626" width="70" height="44" rx="6" fill="#2f3337"/>
    <text x="1500" y="660" font-family="sans-serif" font-size="30" font-weight="bold" fill="#f29a2e" stroke="none">N5</text>
    <circle cx="1290" cy="725" r="22" fill="#2b2b2b"/><circle cx="1510" cy="725" r="22" fill="#2b2b2b"/>
  </g>

  <!-- The morning after -->
  <g data-word="der Kater">
    <rect x="1040" y="40" width="300" height="200" rx="16" fill="#fdf6e3"/>
    <circle cx="1110" cy="140" r="40" fill="#f0c9a6"/>
    <path d="M1085 130 l15 6 M1120 136 l15 -6 M1095 165 q15 -10 30 0" fill="none" stroke-width="3"/>
    <path d="M1070 100 c-10 -20 20 -30 30 -20 c10 -15 40 -5 30 15" fill="none" stroke="#e45b4f" stroke-width="4"/>
    <rect x="1190" y="110" width="40" height="70" rx="8" fill="#9fd3ea"/>
    <circle cx="1280" cy="150" r="22" fill="#ffffff"/><path d="M1268 150 h24" fill="none" stroke-width="3"/>
  </g>
</svg>
