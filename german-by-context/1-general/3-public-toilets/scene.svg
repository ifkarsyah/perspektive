<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- Outside: street toilets -->
  <rect x="0" y="0" width="400" height="900" fill="#d6ecf6" stroke="none"/>
  <rect x="0" y="720" width="400" height="180" fill="#b8b2a7" stroke="none"/>
  <g data-word="die Berliner Toilette">
    <rect x="40" y="380" width="170" height="340" rx="20" fill="#3d5f4c"/>
    <path d="M30 380 c0 -40 190 -40 190 0 Z" fill="#2f4a3b"/>
    <rect x="70" y="440" width="110" height="200" rx="10" fill="#4f7a62"/>
    <rect x="90" y="410" width="70" height="22" rx="4" fill="#ffffff"/>
  </g>
  <g data-word="das Dixi-Klo">
    <rect x="240" y="450" width="130" height="270" rx="8" fill="#3d6fb6"/>
    <path d="M232 450 c0 -30 146 -30 146 0 Z" fill="#2d568f"/>
    <rect x="270" y="500" width="70" height="20" rx="4" fill="#ffffff"/>
    <circle cx="350" cy="600" r="7" fill="#e45b4f"/>
  </g>
  <g data-word="die Nette Toilette">
    <rect x="80" y="120" width="230" height="190" rx="10" fill="#ffffff"/>
    <circle cx="195" cy="195" r="50" fill="#e45b4f"/>
    <path d="M175 185 c0 -10 10 -10 10 0 M205 185 c0 -10 10 -10 10 0 M170 210 c15 20 40 20 55 0" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M110 275 h170" fill="none" stroke="#e45b4f" stroke-width="8"/>
  </g>
  <path d="M400 0 V900" fill="none" stroke-width="6"/>

  <!-- Inside -->
  <g data-word="die öffentliche Toilette">
    <rect x="400" y="0" width="1200" height="720" fill="#e9f1f0" stroke="none"/>
    <path d="M400 100 H1600 M400 200 H1600 M400 300 H1600 M400 400 H1600 M400 500 H1600 M400 600 H1600" fill="none" stroke="#d3e0de" stroke-width="2"/>
    <rect x="400" y="720" width="1200" height="180" fill="#a7b8bb" stroke="none"/>
  </g>

  <!-- Turnstile with fee and coin -->
  <g data-word="das Drehkreuz">
    <rect x="440" y="420" width="90" height="300" rx="8" fill="#9aa3a8"/>
    <path d="M530 520 h110 M530 520 l80 50 M530 520 l80 -50" fill="none" stroke="#c3cbd0" stroke-width="12"/>
    <rect x="455" y="450" width="60" height="40" rx="4" fill="#2f3337"/>
  </g>
  <g data-word="die Gebühr">
    <rect x="440" y="300" width="160" height="80" rx="8" fill="#f6d53b"/>
    <text x="458" y="355" font-family="sans-serif" font-size="40" font-weight="bold" fill="#33302c" stroke="none">0,50€</text>
  </g>
  <g data-word="die Münze"><circle cx="485" cy="530" r="18" fill="#e0c06a"/></g>
  <g data-word="der Wertbon">
    <path d="M540 640 v-50 h70 v50 l-8 -6 l-8 6 l-8 -6 l-8 6 l-8 -6 l-8 6 l-8 -6 l-8 6 Z" fill="#ffffff"/>
    <path d="M552 602 h46 M552 614 h30" fill="none" stroke-width="2"/>
  </g>

  <!-- Attendant with tip plate -->
  <g data-word="das Toilettenpersonal">
    <circle cx="720" cy="380" r="32" fill="#c58c5c"/>
    <path d="M688 372 c0 -42 64 -42 64 0" fill="#2f2622"/>
    <path d="M682 415 h76 l10 160 h-96 Z" fill="#7fa79a"/>
    <path d="M690 575 v145 M750 575 v145" fill="none" stroke="#2f3f5c" stroke-width="18"/>
  </g>
  <rect x="660" y="580" width="140" height="18" fill="#9a6b43"/>
  <g data-word="der Teller">
    <ellipse cx="730" cy="575" rx="50" ry="12" fill="#ffffff"/>
    <circle cx="715" cy="568" r="8" fill="#e0c06a"/><circle cx="740" cy="570" r="8" fill="#c9c9c9"/>
  </g>

  <!-- Signs -->
  <g data-word="die Damentoilette"><rect x="850" y="40" width="120" height="110" rx="8" fill="#ffffff"/>
    <circle cx="910" cy="68" r="12" fill="#e45b4f" stroke="none"/><path d="M910 82 l-24 48 h48 Z" fill="#e45b4f" stroke="none"/></g>
  <g data-word="die Herrentoilette"><rect x="990" y="40" width="120" height="110" rx="8" fill="#ffffff"/>
    <circle cx="1050" cy="68" r="12" fill="#3d6fb6" stroke="none"/><rect x="1036" y="84" width="28" height="50" rx="4" fill="#3d6fb6" stroke="none"/></g>
  <g data-word="das Behinderten-WC"><rect x="1130" y="40" width="120" height="110" rx="8" fill="#3d6fb6"/>
    <circle cx="1185" cy="66" r="10" fill="#ffffff" stroke="none"/><path d="M1185 80 v30 h28 l10 24" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M1175 100 a26 26 0 1 0 34 30" fill="none" stroke="#ffffff" stroke-width="6"/></g>
  <g data-word="der Wickelraum"><rect x="1270" y="40" width="120" height="110" rx="8" fill="#ffffff"/>
    <circle cx="1305" cy="95" r="12" fill="#5b8c5a" stroke="none"/><rect x="1318" y="86" width="50" height="20" rx="8" fill="#5b8c5a" stroke="none"/><path d="M1290 118 h90" fill="none" stroke="#5b8c5a" stroke-width="6"/></g>
  <g data-word="das WC"><rect x="1410" y="40" width="150" height="110" rx="8" fill="#2f3337"/>
    <text x="1430" y="115" font-family="sans-serif" font-size="56" font-weight="bold" fill="#ffffff" stroke="none">WC</text></g>

  <!-- Cubicle with toilet -->
  <g data-word="die Kabine">
    <rect x="860" y="190" width="300" height="530" fill="#c9d8d6"/>
    <rect x="860" y="190" width="300" height="20" fill="#9fb3b0"/>
  </g>
  <g data-word="die Toilette">
    <rect x="950" y="440" width="110" height="90" rx="8" fill="#ffffff"/>
    <path d="M930 530 H1080 c0 40 -30 70 -55 72 l10 118 h-60 l10 -118 c-25 -2 -55 -32 -55 -72 Z" fill="#ffffff"/>
    <g data-word="der Spülknopf"><rect x="985" y="450" width="40" height="22" rx="5" fill="#c3cbd0"/></g>
  </g>
  <g data-word="die Spülung"><path d="M1005 440 V300" fill="none" stroke="#9aa3a8" stroke-width="10"/></g>
  <g data-word="das Toilettenpapier">
    <path d="M1090 520 H1135" fill="none" stroke="#9aa3a8" stroke-width="5"/>
    <rect x="1094" y="505" width="38" height="44" rx="18" fill="#ffffff"/>
    <path d="M1094 530 v60 h18 v-40" fill="#ffffff"/>
  </g>
  <g data-word="das Schloss">
    <rect x="1120" y="380" width="28" height="44" rx="4" fill="#c3cbd0"/>
    <circle cx="1134" cy="392" r="8" fill="#e45b4f"/>
  </g>

  <!-- Urinal, sink, dryer -->
  <g data-word="das Pissoir">
    <path d="M1200 360 h80 v130 c0 40 -80 40 -80 0 Z" fill="#ffffff"/>
    <ellipse cx="1240" cy="470" rx="24" ry="10" fill="#e6eaec"/>
  </g>
  <g data-word="das Waschbecken">
    <path d="M1320 470 H1500 c0 40 -40 60 -90 60 s-90 -20 -90 -60 Z" fill="#ffffff"/>
    <rect x="1395" y="530" width="30" height="190" fill="#ffffff"/>
    <path d="M1400 470 V440 H1430 V455" fill="none" stroke="#9aa3a8" stroke-width="9"/>
  </g>
  <g data-word="die Seife"><rect x="1460" y="400" width="40" height="66" rx="8" fill="#f5c4d6"/><path d="M1480 400 v-14 h16" fill="none" stroke-width="5"/></g>
  <g data-word="der Händetrockner">
    <rect x="1330" y="250" width="140" height="90" rx="14" fill="#e6eaec"/>
    <path d="M1360 340 l-6 20 M1400 340 v22 M1440 340 l6 20" fill="none" stroke="#9aa3a8" stroke-width="4"/>
  </g>
  <g data-word="die Papierhandtücher">
    <rect x="1490" y="240" width="90" height="120" rx="8" fill="#ffffff"/>
    <path d="M1505 360 v30 h60 v-30" fill="#f4f1ea"/>
  </g>
  <g data-word="der Mülleimer"><path d="M1500 640 h80 l-8 80 h-64 Z" fill="#9aa3a8"/><rect x="1494" y="628" width="92" height="14" rx="4" fill="#7c868b"/></g>
</svg>
