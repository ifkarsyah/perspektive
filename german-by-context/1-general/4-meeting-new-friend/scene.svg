<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <g data-word="das Sprachcafé">
    <rect x="0" y="0" width="1600" height="720" fill="#f1e4cf" stroke="none"/>
    <rect x="0" y="720" width="1600" height="180" fill="#a8774d" stroke="none"/>
    <rect x="560" y="40" width="480" height="90" rx="10" fill="#3d6fb6"/>
    <text x="800" y="100" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" stroke="none" text-anchor="middle">SPRACHCAFÉ</text>
  </g>

  <!-- World map on the wall -->
  <g data-word="die Weltkarte">
    <rect x="80" y="170" width="420" height="260" fill="#cfe6f2"/>
    <path d="M130 230 c30 -20 80 -10 90 20 c10 30 -30 50 -20 80 c-30 10 -60 -30 -70 -60 Z" fill="#8fbf6a"/>
    <path d="M250 220 c40 -10 70 10 60 40 c-10 30 -40 20 -50 50 c-20 0 -30 -60 -10 -90 Z" fill="#8fbf6a"/>
    <path d="M330 220 c50 -15 120 0 130 40 c5 30 -40 40 -70 30 c-30 -10 -70 -40 -60 -70 Z" fill="#8fbf6a"/>
    <path d="M400 350 c20 -5 50 5 50 25 c-20 15 -50 10 -50 -25 Z" fill="#8fbf6a"/>
    <circle cx="425" cy="250" r="8" fill="#e45b4f" stroke="none"/>
    <circle cx="395" cy="325" r="8" fill="#e45b4f" stroke="none"/>
  </g>

  <!-- Flags -->
  <g data-word="die Flagge">
    <path d="M1150 170 v260 M1300 170 v260 M1450 170 v260" fill="none" stroke-width="5"/>
    <rect x="1150" y="170" width="120" height="30" fill="#2f2622"/>
    <rect x="1150" y="200" width="120" height="30" fill="#e45b4f"/>
    <rect x="1150" y="230" width="120" height="30" fill="#f2b84b"/>
    <rect x="1300" y="170" width="120" height="45" fill="#e45b4f"/>
    <rect x="1300" y="215" width="120" height="45" fill="#ffffff"/>
    <rect x="1450" y="170" width="120" height="90" fill="#ffffff"/>
    <circle cx="1510" cy="215" r="24" fill="#e45b4f"/>
  </g>

  <!-- Table -->
  <rect x="560" y="560" width="480" height="24" fill="#9a6b43"/>
  <path d="M600 584 v136 M1000 584 v136" fill="none" stroke-width="12"/>

  <g data-word="der Kaffee">
    <path d="M650 560 v-50 h60 v50 Z" fill="#ffffff"/>
    <path d="M710 520 c25 0 25 30 0 30" fill="none"/>
    <path d="M665 495 c-8 -15 8 -20 0 -35 M690 495 c-8 -15 8 -20 0 -35" fill="none" stroke="#9aa3a8"/>
    <path d="M890 560 v-50 h60 v50 Z" fill="#ffffff"/>
    <path d="M890 520 c-25 0 -25 30 0 30" fill="none"/>
  </g>

  <g data-word="das Handy">
    <rect x="770" y="540" width="60" height="18" rx="4" fill="#2f3337"/>
  </g>

  <!-- The new friend (male) -->
  <g data-word="der neue Freund">
    <circle cx="460" cy="380" r="40" fill="#c58c5c"/>
    <path d="M420 376 c0 -55 80 -55 80 0" fill="#2f2622"/>
    <path d="M405 425 h110 l15 220 h-140 Z" fill="#5b8c5a"/>
    <path d="M515 450 l80 60" fill="none" stroke="#c58c5c" stroke-width="16"/>
    <path d="M420 645 v75 M500 645 v75" fill="none" stroke="#2f3f5c" stroke-width="22"/>
  </g>

  <!-- The new friend (female) -->
  <g data-word="die neue Freundin">
    <circle cx="1140" cy="380" r="40" fill="#f0c9a6"/>
    <path d="M1100 380 c-5 -60 85 -60 80 0 l5 50 h-90 Z" fill="#c98f3e"/>
    <circle cx="1140" cy="383" r="35" fill="#f0c9a6"/>
    <path d="M1085 425 h110 l15 220 h-140 Z" fill="#b58ad8"/>
    <path d="M1085 450 l-80 60" fill="none" stroke="#f0c9a6" stroke-width="16"/>
    <path d="M1100 645 v75 M1180 645 v75" fill="none" stroke="#2f3f5c" stroke-width="22"/>
  </g>

  <!-- Handshake -->
  <circle cx="800" cy="510" r="14" fill="#dca97a" stroke="none"/>

  <g data-word="das Namensschild">
    <rect x="425" y="455" width="70" height="40" rx="4" fill="#ffffff"/>
    <text x="460" y="482" font-family="sans-serif" font-size="18" font-weight="bold" fill="#33302c" stroke="none" text-anchor="middle">Ferdi</text>
    <rect x="1105" y="455" width="70" height="40" rx="4" fill="#ffffff"/>
    <text x="1140" y="482" font-family="sans-serif" font-size="18" font-weight="bold" fill="#33302c" stroke="none" text-anchor="middle">Lena</text>
  </g>

  <!-- Speech bubbles -->
  <rect x="540" y="230" width="230" height="80" rx="20" fill="#ffffff"/>
  <path d="M580 310 l-30 40 l60 -40" fill="#ffffff"/>
  <text x="655" y="280" font-family="sans-serif" font-size="30" fill="#33302c" stroke="none" text-anchor="middle">Ich bin Ferdi.</text>
  <rect x="830" y="230" width="230" height="80" rx="20" fill="#ffffff"/>
  <path d="M1020 310 l30 40 l-60 -40" fill="#ffffff"/>
  <text x="945" y="280" font-family="sans-serif" font-size="30" fill="#33302c" stroke="none" text-anchor="middle">Freut mich!</text>
</svg>
