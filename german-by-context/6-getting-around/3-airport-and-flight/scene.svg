<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <g data-word="der Flughafen">
    <rect x="0" y="0" width="1600" height="700" fill="#edf0f3" stroke="none"/>
    <rect x="0" y="700" width="1600" height="200" fill="#c9ced3" stroke="none"/>
    <path d="M0 700 H1600" fill="none" stroke="#b4bac0" stroke-width="2"/>
  </g>

  <!-- Window with a plane -->
  <rect x="880" y="40" width="690" height="280" fill="#cfe6f2"/>
  <path d="M1110 40 V320 M1340 40 V320" fill="none" stroke="#9aa3a8" stroke-width="4"/>
  <g data-word="der Flug">
    <path d="M960 200 c80 -20 400 -30 520 -10 c30 5 30 25 0 30 c-120 15 -440 10 -520 0 c-20 -5 -20 -15 0 -20 Z" fill="#ffffff"/>
    <path d="M1180 205 l-80 70 h40 l110 -65 Z M1200 195 l-70 -60 h35 l95 55 Z" fill="#c3cbd0"/>
    <path d="M1440 190 l40 -60 h20 l-15 65 Z" fill="#3d6fb6"/>
    <path d="M1030 198 h20 M1070 196 h20 M1110 195 h20 M1150 195 h20 M1240 195 h20 M1280 195 h20 M1320 196 h20" fill="none" stroke="#3a3f44" stroke-width="5"/>
  </g>

  <!-- Departure board -->
  <g data-word="der Abflug">
    <rect x="40" y="40" width="520" height="230" rx="8" fill="#2f3337"/>
    <g data-word="die Flugnummer"><text x="60" y="88" font-family="monospace" font-size="26" fill="#f6d53b" stroke="none">XY 482</text></g>
    <path d="M200 80 h170" fill="none" stroke="#ffffff" stroke-width="10"/>
    <text x="400" y="88" font-family="monospace" font-size="26" fill="#ffffff" stroke="none">B12</text>
    <text x="60" y="140" font-family="monospace" font-size="26" fill="#f6d53b" stroke="none">XY 517</text>
    <path d="M200 132 h140" fill="none" stroke="#ffffff" stroke-width="10"/>
    <g data-word="die Verspätung"><text x="400" y="140" font-family="monospace" font-size="26" font-weight="bold" fill="#f2b84b" stroke="none">+40'</text></g>
    <text x="60" y="192" font-family="monospace" font-size="26" fill="#f6d53b" stroke="none">XY 903</text>
    <path d="M200 184 h160" fill="none" stroke="#ffffff" stroke-width="10"/>
    <g data-word="die Annullierung"><text x="400" y="192" font-family="monospace" font-size="26" font-weight="bold" fill="#e45b4f" stroke="none">✕✕✕</text></g>
    <text x="60" y="244" font-family="monospace" font-size="26" fill="#f6d53b" stroke="none">XY 120</text>
    <path d="M200 236 h120" fill="none" stroke="#ffffff" stroke-width="10"/>
  </g>
  <g data-word="das Gate">
    <rect x="610" y="70" width="200" height="90" rx="8" fill="#f6d53b"/>
    <path d="M630 115 h30 M650 100 l15 15 l-15 15" fill="none" stroke-width="5"/>
    <text x="690" y="130" font-family="sans-serif" font-size="44" font-weight="bold" fill="#33302c" stroke="none">B12</text>
  </g>

  <!-- Check-in -->
  <circle cx="200" cy="370" r="30" fill="#e8b98f"/>
  <path d="M170 366 c0 -40 60 -40 60 0" fill="#7a5a3c"/>
  <path d="M164 405 h72 l10 80 h-92 Z" fill="#3d6fb6"/>
  <g data-word="der Check-in-Schalter">
    <rect x="40" y="460" width="380" height="240" fill="#d9dde1"/>
    <rect x="30" y="445" width="400" height="20" fill="#9aa3a8"/>
    <rect x="280" y="380" width="110" height="65" rx="4" fill="#2f3337"/>
    <rect x="288" y="388" width="94" height="49" fill="#cfe6f2" stroke="none"/>
  </g>
  <g data-word="die Gepäckaufgabe">
    <rect x="430" y="600" width="210" height="100" fill="#7c868b"/>
    <rect x="430" y="590" width="210" height="14" fill="#3a3f44"/>
    <rect x="560" y="620" width="70" height="40" fill="#2f3337"/>
    <text x="568" y="648" font-family="monospace" font-size="20" fill="#7fe0a8" stroke="none">23kg</text>
  </g>
  <g data-word="das Aufgabegepäck">
    <rect x="450" y="470" width="100" height="120" rx="10" fill="#3d9a7a"/>
    <path d="M480 470 v-16 h40 v16" fill="none" stroke-width="5"/>
    <path d="M470 490 v80 M530 490 v80" fill="none" stroke="#2f7a5f" stroke-width="3"/>
  </g>

  <!-- Security -->
  <g data-word="die Sicherheitskontrolle">
    <path d="M660 700 V360 h120 V700" fill="none" stroke="#9aa3a8" stroke-width="22"/>
    <rect x="800" y="560" width="220" height="90" rx="8" fill="#c3cbd0"/>
    <path d="M820 560 v-60 h180 v60" fill="#9aa3a8"/>
    <path d="M840 520 h140" fill="none" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M820 650 V700 M1000 650 V700" fill="none" stroke-width="8"/>
  </g>
  <g data-word="die Flüssigkeiten">
    <rect x="850" y="590" width="80" height="60" rx="8" fill="#dff1f7" fill-opacity="0.9"/>
    <rect x="862" y="606" width="16" height="34" rx="3" fill="#6fa8dc"/>
    <rect x="884" y="612" width="14" height="28" rx="3" fill="#f19e7a"/>
    <rect x="904" y="604" width="16" height="36" rx="3" fill="#8bd16f"/>
  </g>

  <!-- Passport control -->
  <g data-word="die Passkontrolle">
    <rect x="1060" y="400" width="190" height="300" fill="#7a8c9a"/>
    <rect x="1080" y="420" width="150" height="110" fill="#cfe6f2"/>
    <circle cx="1155" cy="470" r="22" fill="#c58c5c"/>
    <path d="M1125 530 c0 -36 60 -36 60 0" fill="#2f3f5c"/>
    <rect x="1050" y="540" width="210" height="16" fill="#5f707e"/>
  </g>

  <!-- Baggage carousel -->
  <g data-word="das Gepäckband">
    <path d="M1280 700 c0 -40 300 -40 300 0 v60 c0 40 -300 40 -300 0 Z" fill="#5f6a72"/>
    <path d="M1300 700 c0 -28 260 -28 260 0" fill="none" stroke="#9aa3a8" stroke-width="10"/>
  </g>
  <g data-word="der Koffer">
    <rect x="1320" y="600" width="90" height="100" rx="10" fill="#e45b4f"/>
    <path d="M1345 600 v-14 h40 v14" fill="none" stroke-width="5"/>
    <rect x="1440" y="610" width="100" height="90" rx="10" fill="#f2b84b"/>
    <path d="M1470 610 v-14 h40 v14" fill="none" stroke-width="5"/>
  </g>

  <!-- Traveller with carry-on and boarding pass -->
  <circle cx="300" cy="640" r="30" fill="#8d5a3b"/>
  <path d="M270 636 c0 -40 60 -40 60 0" fill="#2f2622"/>
  <path d="M262 675 h76 l10 150 h-96 Z" fill="#b58ad8"/>
  <path d="M338 700 l50 30" fill="none" stroke-width="10"/>
  <g data-word="die Bordkarte">
    <rect x="380" y="715" width="110" height="50" rx="4" fill="#ffffff"/>
    <path d="M392 730 h50 M392 745 h30" fill="none" stroke="#3d6fb6" stroke-width="4"/>
    <path d="M455 720 v40" fill="none" stroke-width="2" stroke-dasharray="4 4"/>
  </g>
  <g data-word="das Handgepäck">
    <rect x="130" y="740" width="90" height="120" rx="12" fill="#2f3f5c"/>
    <path d="M155 740 v-60 h40 v60" fill="none" stroke="#9aa3a8" stroke-width="6"/>
    <circle cx="145" cy="866" r="8" fill="#2b2b2b"/><circle cx="205" cy="866" r="8" fill="#2b2b2b"/>
  </g>
</svg>
