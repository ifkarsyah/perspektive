<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <rect x="0" y="0" width="1600" height="720" fill="#eef0e8" stroke="none"/>
  <rect x="0" y="720" width="1600" height="180" fill="#c69c6d" stroke="none"/>
  <path d="M0 720 H1600 M0 800 H1600" fill="none" stroke="#a97f52" stroke-width="2"/>

  <!-- Ceiling light -->
  <g data-word="der Strom">
    <path d="M800 0 V80" fill="none" stroke-width="2"/>
    <circle cx="800" cy="105" r="28" fill="#fff4b0"/>
    <path d="M760 105 h-25 M840 105 h25 M775 135 l-15 18 M825 135 l15 18" fill="none" stroke="#f2b84b" stroke-width="4"/>
  </g>

  <!-- Meter cupboard -->
  <rect x="60" y="120" width="300" height="440" rx="6" fill="#d3d8db"/>
  <g data-word="der Stromzähler">
    <rect x="100" y="170" width="220" height="250" rx="8" fill="#f7f7f5"/>
    <g data-word="der Zählerstand">
      <rect x="125" y="215" width="170" height="44" fill="#2f3337"/>
      <text x="135" y="248" font-family="monospace" font-size="30" fill="#ffffff" stroke="none">04521,7</text>
    </g>
    <circle cx="210" cy="310" r="30" fill="#e6eaec"/>
    <path d="M190 310 h40" fill="none" stroke="#e45b4f" stroke-width="5"/>
    <g data-word="die Zählernummer"><rect x="140" y="370" width="140" height="28" fill="#f6d53b" stroke-width="2"/>
      <text x="150" y="391" font-family="monospace" font-size="18" fill="#33302c" stroke="none">1ESY 7713</text></g>
  </g>

  <!-- Gas boiler -->
  <g data-word="das Gas">
    <rect x="420" y="140" width="150" height="230" rx="10" fill="#ffffff"/>
    <rect x="445" y="290" width="100" height="50" rx="6" fill="#e6eaec"/>
    <path d="M495 330 c-18 -18 -6 -30 0 -40 c6 10 18 22 0 40 Z" fill="#6fa8dc" stroke-width="2"/>
    <path d="M460 370 v40 M495 370 v40 M530 370 v40" fill="none" stroke="#9aa3a8" stroke-width="7"/>
  </g>

  <!-- Window with wind turbines -->
  <rect x="620" y="200" width="320" height="240" fill="#d6ecf6"/>
  <g data-word="der Ökostrom">
    <path d="M700 440 V310 M840 440 V290" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M700 310 l-40 -40 M700 310 l55 -12 M700 310 l-12 55" fill="none" stroke="#ffffff" stroke-width="6"/>
    <path d="M840 290 l-45 -35 M840 290 l55 -15 M840 290 l-8 55" fill="none" stroke="#ffffff" stroke-width="6"/>
    <circle cx="700" cy="310" r="7" fill="#ffffff"/><circle cx="840" cy="290" r="7" fill="#ffffff"/>
  </g>

  <!-- Radiator -->
  <g data-word="die Fernwärme">
    <rect x="640" y="480" width="280" height="130" rx="8" fill="#ffffff"/>
    <path d="M675 490 V600 M710 490 V600 M745 490 V600 M780 490 V600 M815 490 V600 M850 490 V600 M885 490 V600" fill="none" stroke-width="2"/>
    <path d="M660 610 V720 M900 610 V720" fill="none" stroke="#c66a43" stroke-width="10"/>
  </g>

  <!-- Technician installing fibre -->
  <g data-word="der Glasfaseranschluss">
    <rect x="1040" y="230" width="90" height="120" rx="8" fill="#ffffff"/>
    <circle cx="1070" cy="300" r="8" fill="#3d9a7a"/><circle cx="1100" cy="300" r="8" fill="#3d9a7a"/>
  </g>
  <g data-word="die Leitung">
    <path d="M1085 350 c0 80 -20 120 40 150 c60 30 60 80 60 120" fill="none" stroke="#f2b84b" stroke-width="7"/>
  </g>
  <g data-word="der Techniker">
    <circle cx="1270" cy="300" r="30" fill="#c58c5c"/>
    <path d="M1240 294 c0 -40 60 -40 60 0 Z" fill="#e0a43c"/>
    <path d="M1236 335 h68 l12 200 h-92 Z" fill="#3d6fb6"/>
    <path d="M1250 535 v185 M1290 535 v185" fill="none" stroke="#2f3f5c" stroke-width="18"/>
    <path d="M1240 360 l-100 -40" fill="none" stroke-width="12"/>
    <rect x="1330" y="620" width="100" height="70" rx="6" fill="#e45b4f"/>
    <path d="M1355 620 v-16 h50 v16" fill="none" stroke-width="5"/>
  </g>

  <!-- Sideboard -->
  <rect x="40" y="620" width="560" height="100" fill="#b98a5e"/>
  <path d="M320 620 V720" fill="none" stroke-width="2"/>
  <g data-word="der Rundfunkbeitrag">
    <rect x="60" y="470" width="200" height="140" rx="8" fill="#2f3337"/>
    <rect x="72" y="482" width="176" height="110" fill="#7fb8d6" stroke="none"/>
    <path d="M150 610 v10" fill="none" stroke-width="8"/>
    <rect x="280" y="545" width="110" height="70" rx="10" fill="#e0a43c"/>
    <circle cx="315" cy="580" r="20" fill="#7a5a3c"/>
    <path d="M350 570 h30 M350 585 h30" fill="none" stroke-width="3"/>
    <path d="M370 545 l20 -40" fill="none" stroke-width="3"/>
  </g>
  <g data-word="die Jahresabrechnung">
    <rect x="410" y="580" width="80" height="40" fill="#efe1b8"/>
    <path d="M410 580 l40 22 l40 -22" fill="none" stroke-width="2"/>
    <rect x="420" y="545" width="60" height="45" fill="#ffffff" stroke-width="2"/>
    <path d="M428 557 h44 M428 568 h30" fill="none" stroke-width="2"/>
  </g>
  <g data-word="der Router">
    <rect x="500" y="585" width="90" height="35" rx="8" fill="#ffffff"/>
    <path d="M512 585 l-6 -30 M578 585 l6 -30" fill="none" stroke-width="5"/>
    <circle cx="530" cy="603" r="5" fill="#5b8c5a"/>
    <g data-word="die Störung">
      <circle cx="550" cy="603" r="6" fill="#e45b4f"/>
      <path d="M550 530 v18 M550 556 v3" fill="none" stroke="#e45b4f" stroke-width="6"/>
    </g>
  </g>

  <!-- Comparing providers on a laptop -->
  <g data-word="das Vergleichsportal">
    <path d="M1420 860 l-20 -12 h180 l-20 12 Z" fill="#9aa3a8"/>
    <rect x="1420" y="740" width="140" height="108" rx="6" fill="#3a3f44"/>
    <rect x="1430" y="750" width="120" height="88" fill="#ffffff" stroke="none"/>
    <rect x="1440" y="810" width="20" height="22" fill="#5b8c5a" stroke="none"/>
    <rect x="1470" y="790" width="20" height="42" fill="#f2b84b" stroke="none"/>
    <rect x="1500" y="770" width="20" height="62" fill="#e45b4f" stroke="none"/>
  </g>
</svg>
