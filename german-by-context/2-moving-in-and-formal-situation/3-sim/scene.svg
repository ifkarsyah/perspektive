<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- Phone shop -->
  <rect x="0" y="0" width="1600" height="700" fill="#eef0f5" stroke="none"/>
  <rect x="0" y="700" width="1600" height="200" fill="#c5c9d3" stroke="none"/>
  <rect x="0" y="0" width="1600" height="40" fill="#7b4fd6" stroke="none"/>

  <!-- Plans on the wall -->
  <g data-word="der Tarif">
    <rect x="120" y="110" width="780" height="270" rx="12" fill="#ffffff"/>
    <rect x="150" y="140" width="220" height="210" rx="10" fill="#f6f7fb"/>
    <text x="205" y="225" font-family="sans-serif" font-size="46" font-weight="bold" fill="#33302c" stroke="none">5 GB</text>
    <text x="215" y="300" font-family="sans-serif" font-size="34" fill="#7b4fd6" stroke="none">9,99 €</text>
    <g data-word="das Datenvolumen">
      <rect x="400" y="140" width="220" height="210" rx="10" fill="#ece5fb"/>
      <text x="440" y="225" font-family="sans-serif" font-size="46" font-weight="bold" fill="#33302c" stroke="none">20 GB</text>
      <text x="455" y="300" font-family="sans-serif" font-size="34" fill="#7b4fd6" stroke="none">19,99 €</text>
    </g>
    <g data-word="die Flatrate">
      <rect x="650" y="140" width="220" height="210" rx="10" fill="#7b4fd6"/>
      <text x="725" y="235" font-family="sans-serif" font-size="80" font-weight="bold" fill="#ffffff" stroke="none">∞</text>
      <text x="705" y="300" font-family="sans-serif" font-size="34" fill="#ffffff" stroke="none">39,99 €</text>
    </g>
  </g>

  <!-- Top-up cards on a rack -->
  <g data-word="die Aufladung">
    <rect x="980" y="120" width="120" height="180" rx="8" fill="#5b8c5a"/>
    <text x="1005" y="230" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" stroke="none">15€</text>
    <rect x="1120" y="120" width="120" height="180" rx="8" fill="#3d6fb6"/>
    <text x="1145" y="230" font-family="sans-serif" font-size="44" font-weight="bold" fill="#ffffff" stroke="none">30€</text>
  </g>

  <!-- Counter -->
  <rect x="80" y="520" width="1100" height="180" fill="#ffffff"/>
  <rect x="70" y="500" width="1120" height="24" fill="#3a3f44"/>

  <g data-word="das Handy">
    <rect x="160" y="300" width="120" height="200" rx="16" fill="#2f3337"/>
    <rect x="170" y="320" width="100" height="160" rx="6" fill="#cfe6f2"/>
    <g data-word="der Empfang">
      <rect x="180" y="340" width="7" height="8" fill="#33302c" stroke="none"/>
      <rect x="190" y="335" width="7" height="13" fill="#33302c" stroke="none"/>
      <rect x="200" y="330" width="7" height="18" fill="#33302c" stroke="none"/>
      <rect x="210" y="325" width="7" height="23" fill="#9aa3a8" stroke="none"/>
    </g>
  </g>
  <g data-word="das Ladegerät">
    <rect x="320" y="440" width="50" height="58" rx="8" fill="#ffffff"/>
    <path d="M335 440 v-16 M355 440 v-16" fill="none" stroke-width="5"/>
    <path d="M345 498 c0 20 60 10 80 -5" fill="none" stroke-width="4"/>
  </g>
  <g data-word="die SIM-Karte">
    <rect x="450" y="440" width="110" height="60" rx="6" fill="#ffffff"/>
    <rect x="470" y="452" width="34" height="34" rx="5" fill="#e0c06a"/>
    <path d="M470 469 h34 M487 452 v34" fill="none" stroke-width="2"/>
    <g data-word="die PIN"><rect x="515" y="452" width="36" height="34" rx="3" fill="#c3cbd0" stroke-width="2"/>
      <text x="518" y="474" font-family="monospace" font-size="13" fill="#33302c" stroke="none">1234</text></g>
  </g>
  <g data-word="die eSIM">
    <rect x="600" y="410" width="90" height="90" fill="#ffffff"/>
    <path d="M612 422 h22 v22 h-22 Z M656 422 h22 v22 h-22 Z M612 466 h22 v22 h-22 Z" fill="#33302c"/>
    <path d="M645 455 h8 v8 h-8 Z M660 470 h8 v8 h-8 Z M645 480 h8 v8 h-8 Z M670 455 h8 v8 h-8 Z" fill="#33302c" stroke="none"/>
  </g>
  <g data-word="der Handyvertrag">
    <rect x="730" y="430" width="100" height="70" fill="#ffffff" transform="rotate(-5 780 465)"/>
    <path d="M742 446 h76 M742 458 h76 M742 470 h60" fill="none" stroke-width="2" transform="rotate(-5 780 465)"/>
    <path d="M790 488 c8 -10 12 4 20 -3 c6 -6 10 4 16 -1" fill="none" stroke="#3d6fb6" stroke-width="3"/>
  </g>
  <g data-word="der Ausweis">
    <rect x="860" y="460" width="80" height="40" rx="5" fill="#cfe1c9"/>
    <rect x="867" y="467" width="22" height="26" fill="#9aa3a8" stroke-width="1.5"/>
    <path d="M897 472 h34 M897 482 h26" fill="none" stroke-width="2"/>
  </g>
  <g data-word="der Router">
    <rect x="980" y="440" width="160" height="60" rx="10" fill="#ffffff"/>
    <path d="M1000 440 l-10 -50 M1120 440 l10 -50" fill="none" stroke-width="6"/>
    <circle cx="1010" cy="470" r="5" fill="#5b8c5a"/><circle cx="1030" cy="470" r="5" fill="#5b8c5a"/><circle cx="1050" cy="470" r="5" fill="#f6d53b"/>
    <g data-word="das WLAN">
      <path d="M1040 400 a30 30 0 0 1 42 0 M1048 412 a18 18 0 0 1 26 0" fill="none" stroke="#3d6fb6" stroke-width="5"/>
      <circle cx="1061" cy="424" r="5" fill="#3d6fb6" stroke="none"/>
    </g>
  </g>

  <!-- Technician on the way to an install -->
  <g data-word="der Techniker">
    <circle cx="1380" cy="420" r="26" fill="#c58c5c"/>
    <path d="M1352 414 c0 -36 56 -36 56 0 Z" fill="#7b4fd6"/>
    <path d="M1350 450 h60 l8 150 h-76 Z" fill="#3a3f44"/>
    <path d="M1365 600 v100 M1395 600 v100" fill="none" stroke-width="11"/>
    <path d="M1410 470 l40 70" fill="none" stroke-width="10"/>
    <rect x="1430" y="540" width="80" height="55" rx="6" fill="#e45b4f"/>
    <path d="M1450 540 v-14 h40 v14" fill="none" stroke-width="4"/>
  </g>
</svg>
