<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" stroke="#33302c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <!-- Empty flat during a viewing -->
  <g data-word="die Wohnung">
    <rect x="0" y="0" width="1600" height="700" fill="#f1ebe0" stroke="none"/>
    <rect x="0" y="700" width="1600" height="200" fill="#c99d6f" stroke="none"/>
    <path d="M0 700 H1600 M0 770 H1600 M0 840 H1600 M150 700 V770 M450 770 V840 M750 700 V770 M1050 770 V840 M1350 700 V770 M300 840 V900 M900 840 V900" fill="none" stroke="#ae835a" stroke-width="2"/>
  </g>
  <g data-word="der Altbau">
    <rect x="0" y="0" width="1600" height="26" fill="#ffffff"/>
    <path d="M0 26 H1600" fill="none" stroke-width="2"/>
    <circle cx="800" cy="40" r="34" fill="#ffffff"/>
    <circle cx="800" cy="40" r="18" fill="none" stroke-width="2"/>
  </g>

  <!-- Front door with other people waiting for the viewing -->
  <rect x="40" y="240" width="200" height="460" fill="#6e6a64"/>
  <g data-word="die Besichtigung">
    <circle cx="95" cy="430" r="20" fill="#c58c5c"/><rect x="71" y="452" width="48" height="90" rx="12" fill="#8b6fb5"/>
    <circle cx="170" cy="415" r="20" fill="#e8b98f"/><path d="M150 410 c0 -30 40 -30 40 0" fill="#e0a43c"/><rect x="146" y="437" width="48" height="95" rx="12" fill="#4f8a8b"/>
    <circle cx="130" cy="470" r="20" fill="#8d5a3b"/><rect x="106" y="492" width="48" height="110" rx="12" fill="#e45b4f"/>
    <path d="M118 602 v98 M142 602 v98" fill="none" stroke-width="8"/>
  </g>

  <!-- Agent with clipboard -->
  <g data-word="der Makler">
    <circle cx="360" cy="460" r="22" fill="#e8b98f"/>
    <path d="M338 452 c0 -30 44 -30 44 0" fill="#3a3f44"/>
    <path d="M332 484 h56 l6 120 h-68 Z" fill="#2f3f5c"/>
    <path d="M360 484 l-8 40 h16 Z" fill="#e45b4f" stroke-width="2"/>
    <path d="M345 604 v96 M375 604 v96" fill="none" stroke-width="9"/>
    <rect x="388" y="520" width="40" height="52" rx="3" fill="#f7f7f7"/>
    <rect x="400" y="514" width="16" height="8" fill="#9aa3a8" stroke-width="2"/>
  </g>
  <!-- Landlady -->
  <g data-word="die Vermieterin">
    <circle cx="490" cy="465" r="22" fill="#f0c9a6"/>
    <path d="M466 470 c-4 -45 52 -45 48 0 c-4 -18 -44 -18 -48 0 Z" fill="#c9c9c9"/>
    <path d="M462 489 h56 l14 120 h-84 Z" fill="#5b8c5a"/>
    <path d="M478 609 v91 M502 609 v91" fill="none" stroke-width="9"/>
  </g>

  <!-- Floor plan on the wall -->
  <g data-word="der Quadratmeter">
    <rect x="610" y="170" width="240" height="190" fill="#ffffff"/>
    <path d="M630 190 H830 V340 H630 Z M730 190 V280 M630 280 H780" fill="none" stroke="#3d6fb6" stroke-width="3"/>
    <text x="690" y="330" font-family="sans-serif" font-size="28" fill="#3d6fb6" stroke="none">54 m²</text>
  </g>

  <!-- Table with paperwork -->
  <rect x="560" y="560" width="400" height="20" fill="#9a6b43"/>
  <path d="M580 580 V700 M940 580 V700" fill="none" stroke-width="10"/>
  <g data-word="der Mietvertrag">
    <rect x="580" y="520" width="80" height="40" fill="#ffffff" transform="rotate(-6 620 540)"/>
    <path d="M592 532 h55 M592 542 h55 M592 552 h35" fill="none" stroke-width="2" transform="rotate(-6 620 540)"/>
    <path d="M655 556 l40 -30" fill="none" stroke="#3d6fb6" stroke-width="5"/>
  </g>
  <g data-word="die Bewerbung">
    <rect x="700" y="530" width="110" height="30" rx="4" fill="#3d6fb6"/>
    <g data-word="die SCHUFA-Auskunft"><rect x="712" y="500" width="45" height="32" fill="#ffffff" stroke-width="2"/><rect x="718" y="508" width="20" height="6" fill="#5b8c5a" stroke="none"/></g>
    <g data-word="der Gehaltsnachweis"><rect x="760" y="494" width="45" height="38" fill="#fff3c4" stroke-width="2"/><path d="M768 506 h28 M768 516 h20" fill="none" stroke-width="2"/></g>
  </g>
  <g data-word="die Kaution">
    <rect x="830" y="525" width="80" height="35" fill="#efe1b8"/>
    <path d="M830 525 l40 20 l40 -20" fill="none" stroke-width="2"/>
    <rect x="845" y="510" width="50" height="22" fill="#8bbf7a" stroke-width="2"/>
  </g>
  <g data-word="die Anzeige">
    <rect x="880" y="470" width="70" height="50" rx="4" fill="#3a3f44" transform="rotate(4 915 495)"/>
    <rect x="886" y="476" width="58" height="38" fill="#ffffff" stroke="none" transform="rotate(4 915 495)"/>
    <path d="M900 505 l15 -15 l15 15 v8 h-30 Z" fill="#e45b4f" stroke-width="2" transform="rotate(4 915 495)"/>
  </g>

  <!-- Fitted kitchen with a flatmate -->
  <g data-word="die Einbauküche">
    <rect x="990" y="230" width="300" height="110" fill="#e9eef0"/>
    <path d="M1090 230 V340 M1190 230 V340" fill="none" stroke-width="2"/>
    <rect x="990" y="470" width="300" height="230" fill="#e9eef0"/>
    <rect x="980" y="455" width="320" height="18" fill="#9a6b43"/>
    <rect x="1090" y="500" width="100" height="150" rx="6" fill="#3a3f44"/>
    <path d="M1010 520 h50 M1220 520 h50" fill="none" stroke-width="5"/>
  </g>
  <g data-word="die Mitbewohnerin">
    <circle cx="1230" cy="380" r="20" fill="#8d5a3b"/>
    <path d="M1208 385 c-4 -42 48 -42 44 0 l4 30 h-52 Z" fill="#2f2622"/>
    <circle cx="1230" cy="384" r="17" fill="#8d5a3b"/>
    <rect x="1206" y="405" width="48" height="50" rx="10" fill="#f2b84b"/>
  </g>

  <!-- Balcony door -->
  <g data-word="der Balkon">
    <rect x="1330" y="170" width="230" height="530" fill="#cfe6f2"/>
    <path d="M1445 170 V700" fill="none"/>
    <path d="M1330 520 H1560 M1345 520 V700 M1375 520 V700 M1405 520 V700 M1435 520 V700 M1465 520 V700 M1495 520 V700 M1525 520 V700" fill="none" stroke="#5e5a54" stroke-width="4"/>
    <path d="M1490 520 c-10 -40 10 -70 20 -90 c10 20 30 50 20 90 Z" fill="#6fae5f"/>
    <rect x="1485" y="505" width="50" height="35" fill="#c66a43"/>
  </g>
</svg>
