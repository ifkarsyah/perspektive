    <path d="M260 545 l9 18 l20 3 l-15 13 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -13 l20 -3 Z" fill="#f6d53b" stroke-width="2"/>
    <path d="M310 545 l9 18 l20 3 l-15 13 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -13 l20 -3 Z" fill="#f6d53b" stroke-width="2"/>
    <path d="M360 545 l9 18 l20 3 l-15 13 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -13 l20 -3 Z" fill="#f6d53b" stroke-width="2"/>
    <path d="M410 545 l9 18 l20 3 l-15 13 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -13 l20 -3 Z" fill="#e6eaec" stroke-width="2"/>
  </g>

  <!-- Checkout panel -->
  <rect x="540" y="200" width="390" height="470" rx="10" fill="#f4f6f8"/>
  <g data-word="die Lieferadresse">
    <rect x="565" y="225" width="340" height="80" rx="6" fill="#ffffff"/>
    <path d="M585 248 l12 -12 l12 12 v18 h-24 Z" fill="#3d6fb6" stroke-width="2"/>
    <path d="M630 245 h250 M630 265 h200 M630 285 h160" fill="none" stroke="#c3cbd0" stroke-width="6"/>
  </g>
  <g data-word="die Zahlungsart">
    <rect x="565" y="325" width="340" height="70" rx="6" fill="#ffffff"/>
    <circle cx="590" cy="360" r="10" fill="#3d6fb6" stroke-width="2"/>
    <g data-word="die Kreditkarte"><rect x="615" y="340" width="64" height="40" rx="5" fill="#2f3337"/><rect x="623" y="348" width="12" height="9" rx="2" fill="#e0c06a" stroke-width="1.5"/></g>
    <circle cx="710" cy="360" r="10" fill="#ffffff" stroke-width="2"/>
    <path d="M730 352 h120 M730 370 h80" fill="none" stroke="#c3cbd0" stroke-width="6"/>
