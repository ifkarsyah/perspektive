  <!-- Phone with tracking and order confirmation -->
  <rect x="1320" y="80" width="230" height="440" rx="28" fill="#2f3337"/>
  <rect x="1334" y="100" width="202" height="400" rx="14" fill="#ffffff"/>
  <g data-word="die Bestellbestätigung">
