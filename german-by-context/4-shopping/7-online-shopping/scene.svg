  <g data-word="die Bestellung">
    <rect x="1100" y="740" width="200" height="140" fill="#c89a63"/>
    <path d="M1100 775 H1300 M1200 740 V775" fill="none" stroke-width="2"/>
    <g data-word="die Bestellnummer"><rect x="1130" y="800" width="140" height="50" fill="#ffffff" stroke-width="2"/>
      <path d="M1140 812 v28 M1146 812 v28 M1154 812 v28 M1158 812 v28 M1166 812 v28 M1174 812 v28 M1178 812 v28 M1186 812 v28 M1196 812 v28 M1200 812 v28 M1208 812 v28 M1214 812 v28" fill="none" stroke-width="2"/></g>
  </g>
  <g data-word="die Rücksendung">
    <rect x="1340" y="760" width="200" height="120" fill="#d6ab76"/>
    <path d="M1340 790 H1540" fill="none" stroke-width="2"/>
    <rect x="1380" y="805" width="120" height="55" fill="#ffffff" stroke-width="2"/>
    <path d="M1470 832 h-60 M1425 818 l-15 14 l15 14" fill="none" stroke="#e45b4f" stroke-width="5"/>
