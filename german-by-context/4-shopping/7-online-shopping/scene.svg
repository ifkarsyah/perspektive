    <circle cx="830" cy="128" r="8" fill="#3d6fb6" stroke="none"/>
    <path d="M816 150 c4 -14 24 -14 28 0" fill="#3d6fb6" stroke="none"/>
  </g>
  <g data-word="der Warenkorb">
