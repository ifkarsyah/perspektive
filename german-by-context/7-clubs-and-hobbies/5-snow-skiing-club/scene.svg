    <g data-word="der Pflug"><path d="M620 800 l40 -40 M700 800 l-40 -40" fill="none" stroke="#3d6fb6" stroke-width="7"/></g>
  </g>

  <!-- Skier in full kit -->
  <circle cx="1000" cy="660" r="34" fill="#f0c9a6"/>
  <g data-word="der Helm"><path d="M964 660 c0 -52 72 -52 72 0 Z" fill="#3d6fb6"/></g>
  <g data-word="die Skibrille"><rect x="970" y="652" width="60" height="22" rx="10" fill="#f29a2e"/></g>
  <g data-word="die Skijacke"><path d="M955 700 h90 l14 120 h-118 Z" fill="#3d9a7a"/></g>
  <g data-word="die Handschuhe"><circle cx="935" cy="790" r="14" fill="#2f3337"/><circle cx="1065" cy="790" r="14" fill="#2f3337"/></g>
  <g data-word="der Skistock"><path d="M935 790 l-20 100 M1065 790 l20 100" fill="none" stroke="#9aa3a8" stroke-width="5"/></g>
  <g data-word="die Skihose"><path d="M960 820 h80 l-6 50 h-22 l-12 -30 l-12 30 h-22 Z" fill="#2f3f5c"/></g>
  <g data-word="der Skischuh"><rect x="960" y="860" width="34" height="24" rx="4" fill="#e45b4f"/><rect x="1006" y="860" width="34" height="24" rx="4" fill="#e45b4f"/></g>
  <g data-word="der Ski"><path d="M860 888 h260 c10 0 20 -6 24 -16" fill="none" stroke="#f6d53b" stroke-width="8"/></g>

  <!-- Snowboard, ski pass, mulled wine -->
  <g data-word="das Snowboard">
    <rect x="1180" y="700" width="70" height="190" rx="34" fill="#b58ad8"/>
    <g data-word="die Bindung"><rect x="1190" y="740" width="50" height="22" rx="5" fill="#2f3337"/><rect x="1190" y="820" width="50" height="22" rx="5" fill="#2f3337"/></g>
  </g>
  <g data-word="der Skipass">
    <rect x="1290" y="760" width="120" height="76" rx="8" fill="#3d6fb6"/>
    <path d="M1305 780 h50 M1305 798 h70" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="1370" y="790" width="28" height="34" fill="#ffffff" stroke-width="2"/>
  </g>
  <g data-word="der Glühwein">
    <path d="M1450 880 v-80 h70 v80 Z" fill="#c33f3f"/>
    <path d="M1520 815 c25 0 25 45 0 45" fill="none" stroke-width="6"/>
    <path d="M1470 790 c-5 -15 10 -20 5 -35 M1495 790 c-5 -15 10 -20 5 -35" fill="none" stroke="#9aa3a8" stroke-width="3"/>
  </g>
