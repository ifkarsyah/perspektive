    <circle cx="420" cy="760" r="8" fill="#9aa3a8"/><circle cx="960" cy="760" r="8" fill="#9aa3a8"/>
    <g data-word="das Ventil"><rect x="412" y="618" width="16" height="30" rx="3" fill="#9aa3a8"/></g>
    <g data-word="der Rahmen">
      <path d="M420 760 L600 760 L520 590 Z M600 760 L870 600 L520 590 M870 600 L960 760" fill="none" stroke="#3d6fb6" stroke-width="14"/>
