  <g data-word="die Abfahrt"><path d="M520 175 L940 410" fill="none" stroke="#c9c3b8" stroke-width="14"/></g>
  <circle cx="300" cy="275" r="10" fill="#e45b4f" stroke="none"/><circle cx="660" cy="255" r="10" fill="#3d6fb6" stroke="none"/>
  <g data-word="der Gegenwind">
    <path d="M1150 120 c40 -20 80 20 120 0 M1130 160 c40 -20 80 20 120 0 M1170 80 c30 -15 60 15 90 0" fill="none" stroke="#7fb8d6" stroke-width="5"/>
  </g>
