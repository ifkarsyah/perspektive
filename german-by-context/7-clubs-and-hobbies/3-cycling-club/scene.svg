    <g data-word="der Lenker"><path d="M870 600 l10 -50" fill="none" stroke="#2f3337" stroke-width="8"/><path d="M860 550 h60 c25 0 25 50 0 50 h-10" fill="none" stroke="#2f3337" stroke-width="9"/></g>
    <g data-word="die Bremse"><path d="M905 560 l14 40" fill="none" stroke="#e45b4f" stroke-width="7"/><rect x="950" y="630" width="20" height="16" rx="3" fill="#e45b4f"/></g>
