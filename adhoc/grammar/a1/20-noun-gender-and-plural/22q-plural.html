<style>

<script>
const PAT = {e:"-e",ue:"-¨e",er:"-er",uer:"-¨er",n:"-(e)n",s:"-s",zero:"no change",u:"¨ only"};
const PAT_NAME = {e:"add -e",ue:"umlaut + -e",er:"add -er",uer:"umlaut + -er",n:"add -n / -en",s:"add -s",zero:"nothing changes",u:"only umlaut"};
const RULE = {
  1:"Feminine nouns take -n / -en.",
  2:"Female person in -in takes -nen.",
  3:"Masculine/neuter in -er, -el, -en: no ending, sometimes an umlaut.",
  4:"Short masculine nouns take -e, often with umlaut.",
  5:"Short neuter nouns take -er, with umlaut if possible.",
  6:"Words ending in a vowel like -o, -i, -y, and foreign words, take -s."
};
const WORDS = [
  {s:"Tisch",g:"der",p:"Tische",k:"e",r:4,en:"table",i:"tisch"},
  {s:"Tag",g:"der",p:"Tage",k:"e",r:4,en:"day",i:"tag"},
  {s:"Hund",g:"der",p:"Hunde",k:"e",r:4,en:"dog",i:"hund"},
  {s:"Stuhl",g:"der",p:"Stühle",k:"ue",r:4,en:"chair",i:"stuhl"},
  {s:"Zug",g:"der",p:"Züge",k:"ue",r:4,en:"train",i:"zug"},
  {s:"Baum",g:"der",p:"Bäume",k:"ue",r:4,en:"tree",i:"baum"},
  {s:"Kind",g:"das",p:"Kinder",k:"er",r:5,en:"child",i:"kind"},
  {s:"Bild",g:"das",p:"Bilder",k:"er",r:5,en:"picture",i:"bild"},
  {s:"Buch",g:"das",p:"Bücher",k:"uer",r:5,en:"book",i:"buch"},
  {s:"Haus",g:"das",p:"Häuser",k:"uer",r:5,en:"house",i:"haus"},
  {s:"Mann",g:"der",p:"Männer",k:"uer",r:0,en:"man",i:"person",x:"Exception: short masculine, but umlaut + -er."},
  {s:"Lampe",g:"die",p:"Lampen",k:"n",r:1,en:"lamp",i:"lampe"},
  {s:"Frau",g:"die",p:"Frauen",k:"n",r:1,en:"woman",i:"frau"},
  {s:"Wohnung",g:"die",p:"Wohnungen",k:"n",r:1,en:"flat",i:"wohnung"},
  {s:"Straße",g:"die",p:"Straßen",k:"n",r:1,en:"street",i:"strasse"},
  {s:"Tasche",g:"die",p:"Taschen",k:"n",r:1,en:"bag",i:"tasche"},
  {s:"Zeitung",g:"die",p:"Zeitungen",k:"n",r:1,en:"newspaper",i:"zeitung"},
  {s:"Freundin",g:"die",p:"Freundinnen",k:"n",r:2,en:"(female) friend",i:"frau"},
  {s:"Lehrerin",g:"die",p:"Lehrerinnen",k:"n",r:2,en:"(female) teacher",i:"frau"},
  {s:"Auto",g:"das",p:"Autos",k:"s",r:6,en:"car",i:"auto"},
  {s:"Kino",g:"das",p:"Kinos",k:"s",r:6,en:"cinema",i:"kino"},
  {s:"Handy",g:"das",p:"Handys",k:"s",r:6,en:"mobile phone",i:"handy"},
  {s:"Café",g:"das",p:"Cafés",k:"s",r:6,en:"café",i:"cafe"},
  {s:"Lehrer",g:"der",p:"Lehrer",k:"zero",r:3,en:"teacher",i:"lehrer"},
  {s:"Wagen",g:"der",p:"Wagen",k:"zero",r:3,en:"car, wagon",i:"auto"},
  {s:"Zimmer",g:"das",p:"Zimmer",k:"zero",r:3,en:"room",i:"zimmer"},
  {s:"Messer",g:"das",p:"Messer",k:"zero",r:3,en:"knife",i:"messer"},
  {s:"Apfel",g:"der",p:"Äpfel",k:"u",r:3,en:"apple",i:"apfel"},
  {s:"Vater",g:"der",p:"Väter",k:"u",r:3,en:"father",i:"person"},
  {s:"Mutter",g:"die",p:"Mütter",k:"u",r:0,en:"mother",i:"frau",x:"Exception: feminine, but only an umlaut."},
  {s:"Hand",g:"die",p:"Hände",k:"ue",r:0,en:"hand",i:"hand",x:"Exception: feminine, but umlaut + -e."},
  {s:"Student",g:"der",p:"Studenten",k:"n",r:0,en:"student",i:"person",x:"Exception: masculine, but -en."}
];
const REG = WORDS.filter(w=>w.r);              // words that follow a rule
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick = a => a[Math.random()*a.length|0];
const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const icon = (w,col) => `<svg style="color:${col||`var(--${w.g})`}"><use href="#i-${w.i}"/></svg>`;
const why = w => w.r ? RULE[w.r] : w.x;

function umlaut(s){
  for(let i=s.length-1;i>=0;i--){
    const c=s[i];
    if(c==="u" && i>0 && s[i-1]==="a") return s.slice(0,i-1)+"ä"+s.slice(i-1+1);
    const m={a:"ä",o:"ö",u:"ü",A:"Ä",O:"Ö",U:"Ü"}[c];
    if(m) return s.slice(0,i)+m+s.slice(i+1);
  }
  return s;
}
function apply(s,k){
  switch(k){
    case "e": return s+"e";
    case "ue": return umlaut(s)+"e";
    case "er": return s+"er";
    case "uer": return umlaut(s)+"er";
    case "n": return s.endsWith("e")?s+"n":s.endsWith("in")?s+"nen":s+"en";
    case "s": return s+"s";
    case "zero": return s;
    case "u": return umlaut(s);
  }
}
function wrongForms(w){
  const out=new Set();
  for(const k of shuffle(Object.keys(PAT))){
    const f=apply(w.s,k);
    if(f!==w.p && !/ee$/.test(f)) out.add(f);
  }
  return [...out];
}
function diffHtml(s,p){
  let out="",i=0;
  for(;i<p.length;i++){
    if(i<s.length && s[i]===p[i]) out+=esc(p[i]);
    else if(i<s.length && "äöüÄÖÜ".includes(p[i])) out+=`<span class="hl">${p[i]}</span>`;
    else break;
  }
  if(i<p.length) out+=`<span class="hl">${esc(p.slice(i))}</span>`;
  return out;
}
function notation(w){
  const n = {e:"-e",ue:"-¨e",er:"-er",uer:"-¨er",s:"-s",zero:"-",u:"-¨"}[w.k];
  if(n) return n;
  return w.s.endsWith("e")?"-n":w.s.endsWith("in")?"-nen":"-en";
}

// ---- Question builders. Each returns {type,label,html,opts,answer,explain,word}
const B = {
  article(){
    const w=pick(WORDS);
    return {label:"Article", word:w,
      html:`<div class="prompt">${icon(w)}<div><div class="big"><span class="${w.g}">${w.g}</span> ${esc(w.s)} → <span class="blank">?</span> ${esc(w.p)}</div><div class="en">${esc(w.en)}</div></div></div><p class="q">Which article goes in the plural?</p>`,
      opts:["der","die","das","den"], four:true, answer:"die",
      explain:`Plural is always <b>die</b>, whatever the singular gender.`};
  },
  pattern(){
    const w=pick(WORDS);
    const opts=shuffle([w.k,...shuffle(Object.keys(PAT).filter(k=>k!==w.k)).slice(0,3)]);
    return {label:"Pattern", word:w,
      html:`<div class="prompt">${icon(w)}<div><div class="big"><span class="${w.g}">${w.g}</span> ${esc(w.s)}</div><div class="en">${esc(w.en)}</div></div></div><p class="q">How does it become plural?</p>`,
      opts:opts.map(k=>PAT[k]), four:true, answer:PAT[w.k],
      explain:`die ${diffHtml(w.s,w.p)}: ${PAT_NAME[w.k]}. ${why(w)}`};
  },
  type(){
    const w=pick(WORDS);
    return {label:"Write it", word:w, typed:true,
      html:`<div class="prompt">${icon(w)}<div><div class="big"><span class="${w.g}">${w.g}</span> ${esc(w.s)}</div><div class="en">${esc(w.en)}</div></div></div><p class="q">Write the plural.</p>`,
      answer:w.p, explain:`die ${diffHtml(w.s,w.p)}. ${why(w)}`};
  },
  correct(){
    const w=pick(WORDS.filter(x=>x.k!=="zero"));
    const wrong=shuffle([`die ${wrongForms(w)[0]}`, `${w.g==="die"?"der":w.g} ${w.p}`, `ein ${w.p}`, `die ${w.p}s`, `die ${wrongForms(w)[1]||w.s+"s"}`]);
    const uniq=[...new Set(wrong)].filter(x=>x!==`die ${w.p}`).slice(0,3);
    return {label:"Spot the right one", word:w,
      html:`<div class="prompt">${icon(w,"var(--pl)")}<div><div class="q">Which plural of <b><span class="${w.g}">${w.g}</span> ${esc(w.s)}</b> is correct?</div><div class="en">${esc(w.en)}</div></div></div>`,
      opts:shuffle([`die ${w.p}`,...uniq]), answer:`die ${w.p}`,
      explain:`die ${diffHtml(w.s,w.p)}. Plural takes <b>die</b>, never ein, and only one ending.`};
  },
  ein(){
    const items=[
      {pre:"Ich habe zwei",w:WORDS.find(x=>x.s==="Kind"),en:"I have two children."},
      {pre:"Ich kaufe",w:WORDS.find(x=>x.s==="Apfel"),en:"I buy apples."},
      {pre:"Wir suchen",w:WORDS.find(x=>x.s==="Wohnung"),en:"We are looking for flats."},
      {pre:"Hier gibt es drei",w:WORDS.find(x=>x.s==="Kino"),en:"There are three cinemas here."},
      {pre:"Ich lese",w:WORDS.find(x=>x.s==="Buch"),en:"I read books."}
    ];
    const it=pick(items), w=it.w;
    const opts=shuffle([w.p,`ein ${w.p}`,`eine ${w.p}`,`${wrongForms(w)[0]}`]);
    return {label:"No ein in plural", word:w,
      html:`<div class="prompt">${icon(w,"var(--pl)")}<div><div class="big" style="font-size:1.5rem">${it.pre} <span class="blank">…</span>.</div><div class="en">${it.en}</div></div></div><p class="q">Fill the gap.</p>`,
      opts, answer:w.p, explain:`${it.pre} ${esc(w.p)}. Like English "a", <b>ein</b> has no plural.`};
  },
  dict(){
    const w=pick(WORDS);
    const opts=shuffle([w.p,...wrongForms(w).slice(0,3)]);
    return {label:"Dictionary", word:w,
      html:`<p class="q">A dictionary says:</p><div class="big mono" style="font-size:1.6rem">${esc(w.s)}, <span class="${w.g}">${w.g}</span>, <span class="hl">${esc(notation(w))}</span></div><p class="q">What is the plural? <span class="en">(${esc(w.en)})</span></p>`,
      opts, four:opts.every(o=>o.length<10), answer:w.p,
      explain:`<b>${esc(notation(w))}</b> ${notation(w)==="-"?"means no change":notation(w).includes("¨")?"means add an umlaut"+(notation(w).length>2?" and "+notation(w).replace("-¨","-"):""):"means add "+esc(notation(w).slice(1))}: die ${diffHtml(w.s,w.p)}.`};
  },
  rule(){
    const w=pick(REG);
    const others=shuffle([1,2,3,4,5,6].filter(r=>r!==w.r)).slice(0,3);
    const opts=shuffle([w.r,...others]).map(r=>RULE[r]);
    return {label:"Which rule?", word:w,
      html:`<div class="prompt">${icon(w)}<div><div class="big"><span class="${w.g}">${w.g}</span> ${esc(w.s)} → die ${diffHtml(w.s,w.p)}</div><div class="en">${esc(w.en)}</div></div></div><p class="q">Which rule of thumb explains this?</p>`,
      opts, single:true, answer:RULE[w.r], explain:RULE[w.r]};
  }
};
const PLAN = ["article","pattern","pattern","type","correct","rule","type","ein","dict","pattern","correct","type"];

// ---- State
let qs=[], idx=0, results=[], answered=false;
function buildQuiz(fromMissed){
  if(fromMissed){
    qs=shuffle(fromMissed.map(q=>{ // regenerate same type around the same word
      let n; let tries=0;
      do{ n=B[q.type](); tries++; } while(n.word && q.word && n.word.s!==q.word.s && tries<40);
      n.type=q.type; return n;
    }));
  } else {
    const used=new Set();
    qs=shuffle(PLAN).map(t=>{let q,tries=0;do{q=B[t];q=q();tries++}while(q.word&&used.has(t+q.word.s)&&tries<20);used.add(t+(q.word?q.word.s:""));q.type=t;return q;});
  }
  idx=0; results=[]; answered=false; renderQ();
}
function renderProgress(){
  document.getElementById("progress").innerHTML=qs.map((_,i)=>`<span class="${i<results.length?(results[i].ok?"ok":"no"):i===idx?"now":""}"></span>`).join("");
  const r=results.filter(x=>x.ok).length;
  document.getElementById("qnum").textContent = idx<qs.length?`Question ${idx+1} of ${qs.length}`:`Done`;
  document.getElementById("score").textContent = `${r} correct`;
}
function renderQ(){
  renderProgress();
  const q=qs[idx], card=document.getElementById("card"); answered=false;
  let body=`<span class="kind">${q.label}</span>${q.html}`;
  if(q.typed){
    body+=`<div class="typerow"><span class="fixed">die</span><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Plural"></div>
      <div class="uml">${["ä","ö","ü","ß"].map(c=>`<button class="btn" data-c="${c}" type="button">${c}</button>`).join("")}</div>`;
  } else {
    body+=`<div class="opts ${q.four?"four":""}" style="${q.single?"grid-template-columns:1fr":""}">${q.opts.map((o,i)=>`<button data-o="${esc(o)}"><span class="key">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  body+=`<div id="fb"></div><div class="actions">${q.typed?`<button class="btn primary" id="checkBtn">Check</button>`:""}<button class="btn primary" id="nextBtn" hidden>${idx===qs.length-1?"See results":"Next"}</button></div>`;
  card.innerHTML=body;
  if(q.typed){
    const inp=card.querySelector("#ans"); inp.focus({preventScroll:true});
    card.querySelector(".uml").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||answered)return;const s=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,s)+b.dataset.c+inp.value.slice(inp.selectionEnd??s);inp.focus();inp.setSelectionRange(s+1,s+1)});
    card.querySelector("#checkBtn").addEventListener("click",checkTyped);
  } else {
    card.querySelector(".opts").addEventListener("click",e=>{const b=e.target.closest("button");if(b)choose(b)});
  }
  card.querySelector("#nextBtn").addEventListener("click",advance);
}
function choose(b){
  if(answered) return; answered=true;
  const q=qs[idx], ok=b.dataset.o===q.answer;
  document.querySelectorAll(".opts button").forEach(x=>{x.disabled=true; if(x.dataset.o===q.answer) x.classList.add("right"); else if(x===b) x.classList.add("wrong");});
  finish(ok,"",b.dataset.o);
}
function checkTyped(){
  if(answered) return;
  const q=qs[idx], inp=document.getElementById("ans");
  let v=inp.value.trim().replace(/\s+/g," "); if(!v) return;
  let note="", ok=false;
  const art=v.match(/^(der|die|das|den|ein|eine)\s+/i);
  if(art){v=v.slice(art[0].length); const a=art[1].toLowerCase(); if(a!=="die") note=a.startsWith("ein")?"No ein in the plural.":`Plural is always die, never ${a}.`;}
  const fold=t=>t.replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/Ä/g,"Ae").replace(/Ö/g,"Oe").replace(/Ü/g,"Ue").replace(/ß/g,"ss");
  if(v===q.answer) ok=true;
  else if(v.toLowerCase()===q.answer.toLowerCase()){ok=true;note=note||"Counted, but capitalize it: nouns always start with a capital.";}
  else if(fold(v).toLowerCase()===fold(q.answer).toLowerCase()){ok=true;note=note||`Counted, but write the real letter: ${q.answer}.`;}
  if(art && art[1].toLowerCase()!=="die") ok=false;
  answered=true; inp.disabled=true; inp.classList.add(ok?"right":"wrong");
  document.getElementById("checkBtn").hidden=true;
  finish(ok,note,inp.value.trim());
}
function finish(ok,note,given){
  const q=qs[idx];
  results.push({ok,q,given});
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><span class="res">${ok?"Richtig!":`Not quite. Answer: ${esc(q.answer)}`}</span>${note?`<span class="why">${esc(note)}</span>`:""}<span class="why">${q.explain}</span></div>`;
  const nb=document.getElementById("nextBtn"); nb.hidden=false; nb.focus({preventScroll:true});
  renderProgress();
}
function advance(){
  idx++;
  if(idx<qs.length) renderQ(); else renderResult();
}
function renderResult(){
  renderProgress();
  const r=results.filter(x=>x.ok).length, n=results.length;
  const byType={};
  results.forEach(x=>{const l=x.q.label; byType[l]=byType[l]||[0,0]; byType[l][1]++; if(x.ok) byType[l][0]++;});
  const missed=results.filter(x=>!x.ok);
  const msg = r===n?"Perfekt. Every plural right.": r>=n*0.75?"Sehr gut. A few to review.": r>=n/2?"Halfway there. Review the misses below.":"Go back to the lesson's rules of thumb, then try again.";
  document.getElementById("card").innerHTML=`<div class="result">
    <span class="kind">Result</span>
    <div class="scorebig">${r}<small> / ${n}</small></div>
    <p>${msg}</p>
    <div class="byk">${Object.entries(byType).map(([l,[a,b]])=>`<div><span>${l}</span><b>${a}/${b}</b></div>`).join("")}</div>
    ${missed.length?`<h2>Review</h2><ul class="missed">${missed.map(x=>`<li><span>${x.q.word?`<b class="${x.q.word.g}">${x.q.word.g}</b> ${esc(x.q.word.s)} <span class="en">· ${esc(x.q.word.en)}</span>`:esc(x.q.label)}</span><span class="foot">You answered: ${esc(x.given||"–")}</span><span class="ans">Answer: ${esc(x.q.answer)}</span><span class="why">${x.q.explain}</span></li>`).join("")}</ul>`:""}
    <div class="actions">${missed.length?`<button class="btn" id="retryBtn">Retry the ${missed.length} missed</button>`:""}<button class="btn primary" id="newBtn">New quiz</button></div>
  </div>`;
  document.getElementById("newBtn").addEventListener("click",()=>buildQuiz());
  const rb=document.getElementById("retryBtn"); if(rb) rb.addEventListener("click",()=>buildQuiz(missed.map(x=>x.q)));
  document.getElementById("newBtn").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"){ if(e.key==="Enter"){e.preventDefault(); answered?advance():checkTyped();} return; }
  if(/^[1-4]$/.test(e.key)&&!answered){const b=document.querySelectorAll(".opts button")[+e.key-1]; if(b) choose(b);}
  else if(e.key==="Enter"&&answered&&idx<qs.length&&document.activeElement.id!=="nextBtn"){e.preventDefault();advance();}
});

const enT=document.getElementById("enToggle");
function applyEn(){document.body.classList.toggle("hide-en",!enT.checked);try{localStorage.setItem("pl-en",enT.checked?"1":"0")}catch(e){}}
try{enT.checked=localStorage.getItem("pl-en")==="1"}catch(e){}
enT.addEventListener("change",applyEn); applyEn();
buildQuiz();
</script>
